<link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg,#0f172a,#1e293b);
        color: white;
        font-family: 'PT Sans', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    .waiting-box {
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        border-radius: 18px;
        padding: 50px 60px;
        text-align: center;
        min-width: 450px;
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    h1 {
        color: #fbbf24;
        font-family: 'Lora', serif;
        margin-top: 0;
        margin-bottom: 15px;
        font-size: 2.2rem;
    }

    .subtitle {
        font-size: 1rem;
        color: #cbd5e1;
        margin-bottom: 25px;
    }

    p {
        font-size: 1.1rem;
        margin: 15px 0;
    }

    .highlight {
        color: #fbbf24;
        font-weight: bold;
    }

    .count-display {
        font-size: 1.4rem;
        background: rgba(255,255,255,0.08);
        padding: 18px 35px;
        border-radius: 12px;
        display: inline-block;
        margin-top: 20px;
    }

    .pulse {
        animation: pulse-animation 2s infinite;
    }

    @keyframes pulse-animation {
        0% { opacity: 1; }
        50% { opacity: 0.55; }
        100% { opacity: 1; }
    }
</style>

</head>

<body>

```
<div class="waiting-box">

    <h1 class="pulse">QuantX Trading Arena</h1>

    <div class="subtitle">
        Quant Club IIT BHU • Summer Camp Week 2
    </div>

    <p>
        <strong>Your Assigned Seat:</strong>
        <span class="highlight">{{ player.seat_number }}</span>
    </p>

    <div class="count-display">
        Participants Joined
        <br><br>
        <span id="player-count" class="highlight">
            {{ player_count }}
        </span>
        / {{ max_players }}
    </div>

    <p style="margin-top:25px;">
        Waiting for the trading session to begin...
    </p>

</div>

<script>
    const gameId = "{{ game.id }}";
    const maxPlayers = {{ max_players }};

    const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";

    const socket = new WebSocket(
        protocol + window.location.host + "/ws/waiting/" + gameId + "/"
    );

    socket.onmessage = function(event) {

        const data = JSON.parse(event.data);

        if (data.type === "player_joined") {

            document.getElementById("player-count").innerText =
                data.player_count;

            if (data.player_count >= maxPlayers) {
                window.location.href = "/game/" + gameId + "/";
            }
        }

        if (data.type === "game_started") {
            window.location.href = "/game/" + gameId + "/";
        }
    };

    socket.onerror = function() {
        console.error("WebSocket connection error.");
    };
</script>
